<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="920" viewBox="0 0 1260 920"><rect x="0" y="0" width="1260" height="920" rx="12" fill="#0c0910" stroke="#0c0910"/><text x="36" y="50" font-family="sans-serif" font-size="30" fill="#eee" text-anchor="start">RMP UNICUM · Distribución eléctrica</text><text x="36" y="82" font-family="sans-serif" font-size="18" fill="#baa2d9" text-anchor="start">ESP32 WROOM clásico · 12 ADC directos · plano lógico, sin PCB ruteado</text><rect x="40" y="122" width="335" height="465" rx="12" fill="#191321" stroke="#9063d1"/><text x="62" y="157" font-family="sans-serif" font-size="24" fill="#eee" text-anchor="start">Barra QRE1113GR ×12</text><text x="62" y="188" font-family="sans-serif" font-size="17" fill="#baa2d9" text-anchor="start">Salidas con pull-up a 3,3 V</text><rect x="435" y="122" width="305" height="465" rx="12" fill="#191321" stroke="#9063d1"/><text x="460" y="157" font-family="sans-serif" font-size="24" fill="#eee" text-anchor="start">ESP32 WROOM</text><text x="62" y="230" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">S01  →  GPIO36</text><text x="465" y="230" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">GPIO36  ·  ADC1</text><path d="M375 224 L435 224" fill="none" stroke="#c7a4ff" stroke-width="3"/><text x="62" y="257" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">S02  →  GPIO39</text><text x="465" y="257" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">GPIO39  ·  ADC1</text><path d="M375 251 L435 251" fill="none" stroke="#c7a4ff" stroke-width="3"/><text x="62" y="284" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">S03  →  GPIO34</text><text x="465" y="284" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">GPIO34  ·  ADC1</text><path d="M375 278 L435 278" fill="none" stroke="#c7a4ff" stroke-width="3"/><text x="62" y="311" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">S04  →  GPIO35</text><text x="465" y="311" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">GPIO35  ·  ADC1</text><path d="M375 305 L435 305" fill="none" stroke="#c7a4ff" stroke-width="3"/><text x="62" y="338" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">S05  →  GPIO32</text><text x="465" y="338" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">GPIO32  ·  ADC1</text><path d="M375 332 L435 332" fill="none" stroke="#c7a4ff" stroke-width="3"/><text x="62" y="365" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">S06  →  GPIO33</text><text x="465" y="365" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">GPIO33  ·  ADC1</text><path d="M375 359 L435 359" fill="none" stroke="#c7a4ff" stroke-width="3"/><text x="62" y="392" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">S07  →  GPIO25</text><text x="465" y="392" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">GPIO25  ·  ADC2</text><path d="M375 386 L435 386" fill="none" stroke="#c7a4ff" stroke-width="3"/><text x="62" y="419" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">S08  →  GPIO26</text><text x="465" y="419" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">GPIO26  ·  ADC2</text><path d="M375 413 L435 413" fill="none" stroke="#c7a4ff" stroke-width="3"/><text x="62" y="446" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">S09  →  GPIO27</text><text x="465" y="446" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">GPIO27  ·  ADC2</text><path d="M375 440 L435 440" fill="none" stroke="#c7a4ff" stroke-width="3"/><text x="62" y="473" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">S10  →  GPIO14</text><text x="465" y="473" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">GPIO14  ·  ADC2</text><path d="M375 467 L435 467" fill="none" stroke="#c7a4ff" stroke-width="3"/><text x="62" y="500" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">S11  →  GPIO13</text><text x="465" y="500" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">GPIO13  ·  ADC2</text><path d="M375 494 L435 494" fill="none" stroke="#c7a4ff" stroke-width="3"/><text x="62" y="527" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">S12  →  GPIO4</text><text x="465" y="527" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">GPIO4  ·  ADC2</text><path d="M375 521 L435 521" fill="none" stroke="#c7a4ff" stroke-width="3"/><rect x="800" y="122" width="420" height="315" rx="12" fill="#191321" stroke="#9063d1"/><text x="822" y="157" font-family="sans-serif" font-size="24" fill="#eee" text-anchor="start">TB6612FNG</text><text x="822" y="200" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">AIN1 ← 16     AIN2 ← 17</text><text x="822" y="231" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">PWMA ← 21  ·  Motor A izquierdo</text><text x="822" y="262" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">BIN1 ← 18     BIN2 ← 19</text><text x="822" y="293" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">PWMB ← 22  ·  Motor B derecho</text><text x="822" y="324" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">VCC = 3,3 V    VM = 6 V regulados</text><text x="822" y="355" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">STBY ← 3,3 V por jumper/interruptor</text><text x="822" y="386" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="start">PWMA / PWMB / STBY: 10 kΩ a GND</text><path d="M740 270 L800 270" fill="none" stroke="#c7a4ff" stroke-width="3"/><rect x="800" y="462" width="420" height="125" rx="12" fill="#191321" stroke="#9063d1"/><text x="822" y="495" font-family="sans-serif" font-size="21" fill="#eee" text-anchor="start">Botones a GND + 10 kΩ a 3,3 V</text><text x="822" y="530" font-family="sans-serif" font-size="17" fill="#eee" text-anchor="start">B1 = GPIO5   B2 = GPIO15   B3 = GPIO23</text><text x="822" y="563" font-family="sans-serif" font-size="17" fill="#baa2d9" text-anchor="start">GPIO5/15: botones sueltos durante reset</text><path d="M740 522 L800 522" fill="none" stroke="#c7a4ff" stroke-width="3"/><rect x="40" y="620" width="1180" height="164" rx="12" fill="#191321" stroke="#9063d1"/><text x="62" y="655" font-family="sans-serif" font-size="23" fill="#eee" text-anchor="start">Alimentación · Pololu 6 V + LiPo 2S</text><text x="62" y="692" font-family="sans-serif" font-size="19" fill="#eee" text-anchor="start">LiPo 2S (8,4 V cargada) → regulación 6 V → VM TB6612 → motores</text><text x="62" y="723" font-family="sans-serif" font-size="19" fill="#eee" text-anchor="start">LiPo 2S → regulación 5 V → placa de desarrollo ESP32 + LED de barra (~253 mA)</text><text x="62" y="754" font-family="sans-serif" font-size="19" fill="#eee" text-anchor="start">3V3 de la placa → VCC TB6612 + receptores + pull-ups botones · GND común</text><text x="40" y="825" font-family="sans-serif" font-size="19" fill="#d7baff" text-anchor="start">Wi-Fi activo: robot detenido y lectura ADC suspendida. Al iniciar: Wi-Fi OFF, 12 sensores activos.</text><text x="40" y="860" font-family="sans-serif" font-size="17" fill="#baa2d9" text-anchor="start">Modelo Pololu y corriente de bloqueo pendientes. Ver docs/HARDWARE.md antes de seleccionar regulador/driver.</text></svg>