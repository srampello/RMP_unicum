<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790"><rect x="0" y="0" width="1120" height="790" rx="12" fill="#0c0910" stroke="#0c0910"/><text x="38" y="52" font-family="sans-serif" font-size="28" fill="#eee" text-anchor="start">RMP UNICUM · Una celda analógica QRE1113GR</text><text x="38" y="86" font-family="sans-serif" font-size="19" fill="#baa2d9" text-anchor="start">Repetir 12 veces. Emisor a 5 V; colector con pull-up a 3,3 V.</text><rect x="235" y="320" width="630" height="175" rx="12" fill="#191321" stroke="#9063d1"/><text x="270" y="354" font-family="sans-serif" font-size="23" fill="#eee" text-anchor="start">QRE1113GR · orientación según datasheet</text><text x="320" y="395" font-family="sans-serif" font-size="16" fill="#eee" text-anchor="middle">1 · Ánodo</text><text x="320" y="441" font-family="sans-serif" font-size="15" fill="#baa2d9" text-anchor="middle">IR LED</text><path d="M320 320 L320 295" fill="none" stroke="#c7a4ff" stroke-width="3"/><text x="485" y="395" font-family="sans-serif" font-size="16" fill="#eee" text-anchor="middle">2 · Cátodo</text><text x="485" y="441" font-family="sans-serif" font-size="15" fill="#baa2d9" text-anchor="middle">IR LED</text><text x="675" y="395" font-family="sans-serif" font-size="16" fill="#eee" text-anchor="middle">3 · Colector</text><text x="675" y="441" font-family="sans-serif" font-size="15" fill="#baa2d9" text-anchor="middle">Fototransistor</text><path d="M675 320 L675 295" fill="none" stroke="#c7a4ff" stroke-width="3"/><text x="820" y="395" font-family="sans-serif" font-size="16" fill="#eee" text-anchor="middle">4 · Emisor</text><text x="820" y="441" font-family="sans-serif" font-size="15" fill="#baa2d9" text-anchor="middle">Fototransistor</text><text x="320" y="145" font-family="sans-serif" font-size="21" fill="#c7a4ff" text-anchor="middle">+5V_LED</text><path d="M320 160 L320 192" fill="none" stroke="#c7a4ff" stroke-width="3"/><rect x="267" y="192" width="106" height="48" rx="12" fill="#191321" stroke="#9063d1"/><text x="320" y="222" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="middle">180 Ω</text><path d="M320 240 L320 320" fill="none" stroke="#c7a4ff" stroke-width="3"/><text x="675" y="145" font-family="sans-serif" font-size="21" fill="#c7a4ff" text-anchor="middle">+3V3_SENS</text><path d="M675 160 L675 192" fill="none" stroke="#c7a4ff" stroke-width="3"/><rect x="622" y="192" width="106" height="48" rx="12" fill="#191321" stroke="#9063d1"/><text x="675" y="222" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="middle">47 kΩ</text><path d="M675 240 L675 320" fill="none" stroke="#c7a4ff" stroke-width="3"/><path d="M675 277 L913 277" fill="none" stroke="#c7a4ff" stroke-width="3"/><rect x="913" y="253" width="93" height="48" rx="12" fill="#191321" stroke="#9063d1"/><text x="960" y="282" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="middle">100 Ω</text><path d="M1006 277 L1075 277" fill="none" stroke="#c7a4ff" stroke-width="3"/><text x="1040" y="243" font-family="sans-serif" font-size="18" fill="#eee" text-anchor="middle">Sxx → ADC</text><path d="M1040 277 L1040 349" fill="none" stroke="#c7a4ff" stroke-width="3"/><path d="M1020 349 L1060 349" fill="none" stroke="#c7a4ff" stroke-width="3"/><path d="M1020 361 L1060 361" fill="none" stroke="#c7a4ff" stroke-width="3"/><path d="M1040 361 L1040 413" fill="none" stroke="#c7a4ff" stroke-width="3"/><text x="1040" y="447" font-family="sans-serif" font-size="17" fill="#eee" text-anchor="middle">GND</text><text x="985" y="391" font-family="sans-serif" font-size="16" fill="#eee" text-anchor="middle">1 nF</text><text x="985" y="414" font-family="sans-serif" font-size="14" fill="#baa2d9" text-anchor="middle">opcional</text><text x="665" y="595" font-family="sans-serif" font-size="20" fill="#eee" text-anchor="middle">GND común</text><text x="38" y="654" font-family="sans-serif" font-size="21" fill="#eee" text-anchor="start">Blanco → más reflexión → más conducción → tensión OUT baja.</text><text x="38" y="691" font-family="sans-serif" font-size="19" fill="#baa2d9" text-anchor="start">Negro → menor conducción → OUT alta. Señal normalizada de línea blanca invierte el ADC.</text><text x="38" y="731" font-family="sans-serif" font-size="18" fill="#d7baff" text-anchor="start">No conectar el pull-up del colector a 5 V. Una resistencia por LED; corriente total LED ≈253 mA.</text><path d="M485 495 L485 560" fill="none" stroke="#c7a4ff" stroke-width="3"/><path d="M820 495 L820 560" fill="none" stroke="#c7a4ff" stroke-width="3"/><path d="M485 560 L820 560" fill="none" stroke="#c7a4ff" stroke-width="3"/></svg>